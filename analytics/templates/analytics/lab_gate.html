{% extends "analytics/base.html" %}

{% block content %}
<div class="max-w-xl mx-auto card">
    <h2 class="text-2xl font-semibold mb-4">Data Science Lab Access</h2>
    <p class="text-sm text-slate-600 mb-4">
        The Lab hosts EDA notebooks, feature experiments, and modeling results. A secondary passcode protects sensitive in-progress analyses.
    </p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">{{ form.passcode.label }}</label>
            {{ form.passcode }}
        </div>
        <button class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-500">Unlock Lab</button>
    </form>
</div>
{% endblock %}
